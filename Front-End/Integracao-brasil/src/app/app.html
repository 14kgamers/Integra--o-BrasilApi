<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<title>API Infra Dashboard</title>

<style>
body{
    font-family:Inter,sans-serif;
}

.tech-grid{
    background-image:
        linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:40px 40px;
}

.glass-card{
    background:rgba(15,23,42,.75);
    backdrop-filter:blur(12px);
    border:1px solid rgba(148,163,184,.15);
    transition:.3s;
}

.glass-card:hover{
    transform:translateY(-6px);
    border-color:rgba(96,165,250,.35);
    box-shadow:0 0 35px rgba(59,130,246,.15);
}
</style>

</head>

<body class="bg-slate-950 text-white overflow-hidden">

<div class="flex h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">

        <div class="p-6 border-b border-slate-800">

            <h1 class="text-2xl font-bold text-blue-400">
                API Infra
            </h1>

            <p class="text-xs uppercase tracking-[3px] text-slate-500">
                Management Console
            </p>

        </div>

        <nav class="flex-1 p-3 space-y-1">

            <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition">
                <span class="material-symbols-outlined">
                    add_location
                </span>
                CEP API Controller
            </a>

            <a
              routerLink="/schedule"
              class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition">
              <span class="material-symbols-outlined">
                account_balance
              </span>
              Schedule
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition">
                <span class="material-symbols-outlined">
                    phone_iphone
                </span>
                DDD Controller
            </a>

        </nav>

        <div class="border-t border-slate-800 p-3">

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition">
                <span class="material-symbols-outlined">
                    description
                </span>
                Documentation

            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition">
                <span class="material-symbols-outlined">
                    help
                </span>
                Support
            </a>


        </div>

    </aside>

    <!-- MAIN -->
<div class="flex-1 overflow-y-auto bg-slate-950">
  <router-outlet></router-outlet>
</div>
</div>

</body>
</html>
